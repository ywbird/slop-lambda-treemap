<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lambda Treemap</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>Lambda Treemap</h1>
    <p class="subtitle">람다 대수 식을 트리맵으로 시각화하고 베타 축약을 애니메이션으로 보여줍니다.</p>
    <p class="article-link">이 표기법의 원문: <a href="https://meliplug.info/articles/math/lambda-treemap/" target="_blank" rel="noopener">Lambda Treemap — meliplug.info</a></p>
  </header>

  <main>
    <section id="controls">
      <input id="expr-input" type="text" placeholder="예: (λx. λy. x) a b — λ 대신 \ 로도 입력 가능 — $이름, $숫자(교회 숫자) 사용 가능" aria-label="람다 대수 식 입력" spellcheck="false" autocapitalize="off">
      <details id="variables-details">
        <summary>변수 ($이름 치환)</summary>
        <div id="variables-list"></div>
        <button type="button" id="add-variable-btn" class="var-add">+ 변수 추가</button>
      </details>
      <details id="color-details">
        <summary>색상 (변수별 HSL)</summary>
        <div id="color-list"></div>
        <p class="color-hint">현재 식에 등장하는 변수마다 HSL 슬라이더가 생깁니다. <code>초기화</code>로 자동 색(바인딩 해시)으로 돌아갑니다.</p>
      </details>
      <div id="presets" class="presets" aria-label="예시 식">
        <button type="button" class="preset" data-expr="(λx. λy. x) a b">K 조합자</button>
        <button type="button" class="preset" data-expr="(λx. x x) (λy. y)">자기 적용</button>
        <button type="button" class="preset" data-expr="(λx. x x x) (a b)">다중 대입</button>
        <button type="button" class="preset" data-expr="(λn. λf. λx. f (n f x)) (λf. λx. f x) a b">후속 숫자</button>
        <button type="button" class="preset" data-expr="(λx. x x) (λx. x x)">오메가</button>
      </div>
      <div class="buttons speed-control">
        <button id="parse-btn" type="button">파싱</button>
        <button id="step-btn" type="button" disabled>한 스텝 축약</button>
        <button id="auto-btn" type="button" disabled>자동 축약</button>
        <button id="reset-btn" type="button">초기화</button>
        <button id="export-png-btn" type="button" disabled>PNG 내보내기</button>
        <button id="export-gif-btn" type="button" disabled>GIF 내보내기</button>
        <label for="export-width">내보내기 크기 (px)</label>
        <input id="export-width" type="number" min="100" max="10000" step="10" value="0" aria-label="내보내기 가로 px">
        <span class="size-x">×</span>
        <input id="export-height" type="number" min="100" max="10000" step="10" value="0" aria-label="내보내기 세로 px">
        <label for="speed-slider">애니메이션 속도</label>
        <input id="speed-slider" type="range" min="0" max="2000" step="100" value="700">
        <output id="speed-value" for="speed-slider">700ms</output>
        <label for="easing-select">보간</label>
        <select id="easing-select"></select>
      </div>
      <p id="status" class="status" aria-live="polite"></p>
      <p id="error" class="error" aria-live="polite"></p>
    </section>

    <section id="canvas-wrap">
      <canvas id="treemap-canvas"></canvas>
    </section>
  </main>

  <script type="module" src="js/main.js"></script>
</body>
</html>
