<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lambda Treemap</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div class="header-main">
      <h1>Lambda Treemap</h1>
      <p class="subtitle">Visualize lambda calculus expressions as treemaps and animate beta reduction.</p>
      <p class="article-link">Original article: <a href="https://meliplug.info/articles/math/lambda-treemap/" target="_blank" rel="noopener">Lambda Treemap — meliplug.info</a></p>
    </div>
    <div class="layout-control">
      <label for="layout-mode">View</label>
      <select id="layout-mode" aria-label="Layout mode">
        <option value="stacked">Stacked (default)</option>
        <option value="side-by-side">Side-by-side (inputs ↔ treemap)</option>
        <option value="treemap-only">Treemap only</option>
      </select>
    </div>
  </header>

  <main>
    <section id="controls">
      <div class="tabs">
        <div class="tab-nav" role="tablist">
          <input type="radio" name="control-tab" id="tab-main" checked>
          <label for="tab-main" role="tab">Main</label>
          <input type="radio" name="control-tab" id="tab-vars">
          <label for="tab-vars" role="tab">Variables</label>
          <input type="radio" name="control-tab" id="tab-colors">
          <label for="tab-colors" role="tab">Colors</label>
          <input type="radio" name="control-tab" id="tab-export">
          <label for="tab-export" role="tab">Exporting</label>
        </div>
        <div class="tab-panels">
          <div class="tab-panel" id="panel-main" role="tabpanel">
            <input id="expr-input" type="text" placeholder="e.g. (λx. λy. x) a b — \ also works — $name, $number (Church numerals)" aria-label="Lambda expression" spellcheck="false" autocapitalize="off">
            <div class="buttons">
              <button id="parse-btn" type="button">Parse</button>
              <button id="step-btn" type="button" disabled>Step</button>
              <button id="auto-btn" type="button" disabled>Auto-reduce</button>
              <button id="reset-btn" type="button">Reset</button>
            </div>
            <div class="speed-control">
              <label for="speed-slider">Animation speed</label>
              <input id="speed-slider" type="range" min="0" max="2000" step="100" value="700">
              <output id="speed-value" for="speed-slider">700ms</output>
              <label for="easing-select">Easing</label>
              <select id="easing-select"></select>
            </div>
          </div>
          <div class="tab-panel" id="panel-vars" role="tabpanel">
            <div id="presets" class="presets" aria-label="Example expressions">
              <button type="button" class="preset" data-expr="((λx. λy. x) a b)">K combinator</button>
              <button type="button" class="preset" data-expr="((λx. x x) (λy. y))">Self application</button>
              <button type="button" class="preset" data-expr="((λx. x x x) (a b))">Multi-substitution</button>
              <button type="button" class="preset" data-expr="((λn. λf. λx. f (n f x)) (λf. λx. f x) a b)">Successor number</button>
              <button type="button" class="preset" data-expr="((λx. x x) (λx. x x))">Omega</button>
            </div>
            <div id="variables-list"></div>
            <button type="button" id="add-variable-btn" class="var-add">+ Add variable</button>
          </div>
          <div class="tab-panel" id="panel-colors" role="tabpanel">
            <div id="color-list"></div>
            <p class="color-hint">One HSL row appears per variable in the current expression. <code>Reset</code> returns to the auto color (binding hash).</p>
          </div>
          <div class="tab-panel" id="panel-export" role="tabpanel">
            <canvas id="export-preview" aria-label="Export preview"></canvas>
            <div id="export-result" hidden>
              <img id="export-result-img" alt="Last export">
              <button type="button" id="export-result-clear" aria-label="Clear last export">×</button>
            </div>
            <div class="buttons">
              <button id="export-png-btn" type="button" disabled>Export PNG</button>
              <button id="export-gif-btn" type="button" disabled>Export GIF</button>
            </div>
            <div class="size-row">
              <label for="export-width">Export size (px)</label>
              <input id="export-width" type="number" min="100" max="10000" step="10" value="0" aria-label="Export width px">
              <span class="size-x">×</span>
              <input id="export-height" type="number" min="100" max="10000" step="10" value="0" aria-label="Export height px">
            </div>
            <div class="size-row">
              <label for="export-fps">Frame rate (FPS)</label>
              <input id="export-fps" type="number" min="1" max="60" step="1" value="10" aria-label="GIF frame rate">
            </div>
            <div class="size-row">
              <label for="export-pause">Pause (ms)</label>
              <input id="export-pause" type="number" min="0" max="5000" step="50" value="400" aria-label="Pause after each reduction">
            </div>
            <div id="gif-progress" hidden>
              <div class="gif-progress-text">Idle</div>
              <div class="gif-bar"><div class="gif-bar-fill"></div></div>
            </div>
          </div>
        </div>
      </div>
      <!-- status / error live outside the tabs so they're visible regardless of which tab is active -->
      <p id="status" class="status" aria-live="polite"></p>
      <p id="error" class="error" aria-live="polite"></p>
    </section>

    <section id="canvas-wrap">
      <canvas id="treemap-canvas"></canvas>
      <div id="overlay-status" aria-live="polite">
        <p id="status-overlay" class="status"></p>
        <p id="error-overlay" class="error"></p>
      </div>
    </section>
  </main>

  <script src="vendor/gif.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
