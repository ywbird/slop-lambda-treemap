<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lambda Treemap</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>Lambda Treemap</h1>
    <p class="subtitle">람다 대수 식을 트리맵으로 시각화하고 베타 축약을 애니메이션으로 보여줍니다.</p>
  </header>

  <main>
    <section id="controls">
      <input id="expr-input" type="text" placeholder="예: (λx. λy. x) a b" aria-label="람다 대수 식 입력">
      <div class="buttons">
        <button id="parse-btn" type="button">파싱</button>
        <button id="step-btn" type="button" disabled>한 스텝 축약</button>
        <button id="auto-btn" type="button" disabled>자동 축약</button>
        <button id="reset-btn" type="button">초기화</button>
      </div>
      <p id="status" class="status" aria-live="polite"></p>
      <p id="error" class="error" aria-live="polite"></p>
    </section>

    <section id="canvas-wrap">
      <canvas id="treemap-canvas"></canvas>
    </section>
  </main>

  <script type="module" src="js/main.js"></script>
</body>
</html>
